<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B58">
<title>Friday Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column, week tick-list first, bottom tabs. Wider screens centre the same column. */
:root {
  --bg: #EDF1EF; --card: #FFFFFF; --ink: #14211D; --mut: #586B65; --line: #D8E1DD;
  --acc: #0E6B58; --acc-ink: #FFFFFF; --acc-soft: #DCEEE7;
  --good: #1A7A52; --good-soft: #DAF0E4; --warn: #8F5400; --warn-soft: #FAEBCB; --bad: #B3261E; --bad-soft: #F8DCD9;
  --k-bill: #3E6FB0; --k-loan: #7A4DB3; --k-fuel: #B87400; --k-goal: #1A7A52; --k-debt: #B3261E; --k-save: #0E7C8A;
  --f-display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1311; --card: #141E1B; --ink: #E7F0EC; --mut: #92A69F; --line: #25332E;
    --acc: #4FD1AE; --acc-ink: #05231B; --acc-soft: #163A30;
    --good: #5BD59A; --good-soft: #143629; --warn: #F0B44D; --warn-soft: #3A2D11; --bad: #FF8F85; --bad-soft: #3D1A17;
    --k-bill: #7FA8E6; --k-loan: #B391E8; --k-fuel: #E5A63A; --k-goal: #5BD59A; --k-debt: #FF8F85; --k-save: #4CC3D1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1311; --card: #141E1B; --ink: #E7F0EC; --mut: #92A69F; --line: #25332E;
  --acc: #4FD1AE; --acc-ink: #05231B; --acc-soft: #163A30;
  --good: #5BD59A; --good-soft: #143629; --warn: #F0B44D; --warn-soft: #3A2D11; --bad: #FF8F85; --bad-soft: #3D1A17;
  --k-bill: #7FA8E6; --k-loan: #B391E8; --k-fuel: #E5A63A; --k-goal: #5BD59A; --k-debt: #FF8F85; --k-save: #4CC3D1;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px; -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app { max-width: 720px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 12px 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 700 18px var(--f-display); letter-spacing: -.02em; }
.sync { font-size: 12px; color: var(--mut); display: inline-flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--mut); display: inline-block; }
.sync.ok i { background: var(--good); } .sync.off i { background: var(--warn); }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.nav div { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.nav button { background: none; border: 0; border-radius: 10px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--mut); min-height: 48px; }
.nav button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--acc); background: var(--acc-soft); }

.stack { display: flex; flex-direction: column; gap: 14px; padding-top: 4px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.card.flat { background: transparent; border-style: dashed; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 6px 2px 0; }
.sec-h h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--mut); font-weight: 600; }
.sec-h span { font-size: 12px; color: var(--mut); }
.muted { color: var(--mut); } .small { font-size: 13px; }

.wk-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.wk-head h1 { font-size: 24px; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; }
.iconbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn[disabled] { opacity: .35; cursor: default; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--acc-soft); color: var(--acc); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); } .chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.bad { background: var(--bad-soft); color: var(--bad); }

.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.kpi { min-width: 0; } .kpi small { display: block; font-size: 12px; color: var(--mut); }
.kpi b { font: 600 22px var(--f-display); font-variant-numeric: tabular-nums; display: block; overflow-wrap: anywhere; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; display: flex; margin-top: 12px; }
.bar > i { display: block; height: 100%; background: var(--acc); }
.alert { border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.alert.bad { background: var(--bad-soft); color: var(--bad); } .alert.warn { background: var(--warn-soft); color: var(--warn); } .alert.good { background: var(--good-soft); color: var(--good); }
.alert b { font-weight: 600; }

.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 4px 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.chk { width: 44px; height: 44px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; padding: 0; }
.chk span { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--mut); display: grid; place-items: center; }
.chk svg { width: 16px; height: 16px; stroke: var(--acc-ink); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.row.done .chk span { background: var(--acc); border-color: var(--acc); } .row.done .chk svg { opacity: 1; }
.row.late .chk span { border-color: var(--bad); }
.rname { font-weight: 600; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.rsub { font-size: 13px; color: var(--mut); } .rsub.late { color: var(--bad); font-weight: 500; }
.row.done .rname, .row.done .ramt { color: var(--mut); } .row.done .rname span.t { text-decoration: line-through; text-decoration-thickness: 1px; }
.ramt { font: 600 16px var(--f-display); font-variant-numeric: tabular-nums; background: none; border: 1px dashed transparent; border-radius: 8px; padding: 8px 6px; min-height: 40px; }
.ramt:hover { border-color: var(--line); }
input[type=number].amt, input.fld, select.fld { font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; min-height: 42px; width: 100%; min-width: 0; }
input[type=number].amt { width: 92px; text-align: right; font-weight: 600; }
.btn { background: var(--acc); color: var(--acc-ink); border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 600; min-height: 44px; }
.btn.sec { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.sm { padding: 6px 12px; min-height: 36px; font-size: 13px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--mut); min-width: 0; }
.form .full { grid-column: 1 / -1; }

.wkcard { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.wkcard .l1 { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.wkcard b.d { font: 600 16px var(--f-display); }
.seg { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--line); margin: 10px 0 6px; }
.seg i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--mut); }
.legend em { font-style: normal; display: inline-flex; align-items: center; gap: 5px; }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat b { font: 600 24px var(--f-display); font-variant-numeric: tabular-nums; display: block; }
.stat small { color: var(--mut); font-size: 12px; }
ul.pts { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
ul.pts li { overflow-wrap: anywhere; }
.verdict { display: flex; gap: 12px; align-items: center; }
.verdict .big { font: 700 34px var(--f-display); font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: right; padding: 7px 6px; border-top: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; } th { color: var(--mut); font-weight: 500; border-top: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 20; font-size: 14px; max-width: calc(100% - 32px); }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--acc); color: var(--acc-ink); display: grid; place-items: center; z-index: 7; box-shadow: 0 4px 14px rgba(0, 0, 0, .28); }
.fab svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; }
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 30; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--card); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-height: 90%; overflow: auto; }
.sheet > * { max-width: 720px; margin-left: auto; margin-right: auto; }
.sheet h2 { font-size: 18px; margin-bottom: 12px; }
@media (min-width: 720px) { .kpis { gap: 16px; } .stack { gap: 16px; } }
@media (prefers-reduced-motion: no-preference) { .bar > i, .seg i { transition: width .25s ease; } }
</style>

<body>
<div class="app" id="app"></div>
<script>
/* Friday Ledger engine: pure functions, no DOM. Dates are 'YYYY-MM-DD' strings. */
(function (root) {
  'use strict';
  var DAY = 86400000;
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var D = function (s) { var p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); };
  var iso = function (dt) { return dt.getUTCFullYear() + '-' + pad(dt.getUTCMonth() + 1) + '-' + pad(dt.getUTCDate()); };
  var addDays = function (s, n) { return iso(new Date(D(s).getTime() + n * DAY)); };
  var dow = function (s) { return D(s).getUTCDay(); };
  var dim = function (y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); };
  var diff = function (a, b) { return Math.round((D(b) - D(a)) / DAY); };
  var ymd = function (y, m, d) { return y + '-' + pad(m) + '-' + pad(d); };
  var prevFri = function (s) { return addDays(s, -((dow(s) - 5 + 7) % 7)); };
  var addMonths = function (ym, n) {
    var p = ym.split('-').map(Number), y = p[0], m = p[1] + n;
    y += Math.floor((m - 1) / 12); m = (((m - 1) % 12) + 12) % 12 + 1;
    return y + '-' + pad(m);
  };
  var sum = function (a) { return a.reduce(function (t, x) { return t + x; }, 0); };
  var r2 = function (n) { return Math.round(n * 100) / 100; };

  function nthWeekday(y, m, n, wd) {
    var off = (wd - dow(ymd(y, m, 1)) + 7) % 7;
    var day = 1 + off + (n - 1) * 7;
    return day > dim(y, m) ? null : ymd(y, m, day);
  }

  /* All dates an item falls due in [from, to). */
  function occurrences(item, from, to) {
    var out = [], r = item.rule || {};
    function push(date) {
      if (!date || date < from || date >= to) return;
      if (item.from && date < item.from) return;
      if (item.to && date > item.to) return;
      out.push(date);
    }
    if (r.t === 'weekly') {
      var c = from;
      while (dow(c) !== 5) c = addDays(c, 1);
      for (; c < to; c = addDays(c, 7)) push(c);
    } else if (r.t === 'every') {
      var step = 7 * Math.max(1, r.n || 1);
      var k = Math.ceil(diff(r.anchor, from) / step);
      for (var e = addDays(r.anchor, k * step); e < to; e = addDays(e, step)) push(e);
    } else {
      var a = from.split('-').map(Number), b = to.split('-').map(Number);
      var y = a[0], m = a[1];
      while (y < b[0] || (y === b[0] && m <= b[1])) {
        push(r.t === 'nth' ? nthWeekday(y, m, r.n || 1, 5) : ymd(y, m, Math.min(r.day || 1, dim(y, m))));
        m++; if (m > 12) { m = 1; y++; }
      }
    }
    return out;
  }

  function ruleText(r) {
    var o = function (n) { var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
    if (r.t === 'weekly') return 'Every Friday';
    if (r.t === 'nth') return 'The ' + o(r.n) + ' Friday of the month';
    if (r.t === 'every') return 'Every ' + r.n + ' weeks';
    return 'The ' + o(r.day) + ' of each month';
  }

  function defaults() {
    var dom = function (d) { return { t: 'dom', day: d }; };
    return {
      v: 1, rev: 0,
      settings: { pay: null, startFri: '2026-11-13' },
      items: [
        { id: 'phone', name: 'Phone bill', amt: 96, kind: 'bill', rule: dom(5) },
        { id: 'house', name: 'House', amt: 350, kind: 'bill', rule: { t: 'nth', n: 3 } },
        { id: 'carins', name: 'Car insurance', amt: 147, kind: 'bill', rule: dom(4) },
        { id: 'unison', name: 'Unison', amt: 16, kind: 'bill', rule: dom(15) },
        { id: 'allow', name: 'Allowances', amt: 100, kind: 'bill', rule: dom(1) },
        { id: 'aa', name: 'AA cover', amt: 11, kind: 'bill', rule: dom(16) },
        { id: 'ee', name: 'EE', amt: 11, kind: 'bill', rule: dom(30) },
        { id: 'yt', name: 'YouTube', amt: 13, kind: 'bill', rule: dom(22) },
        { id: 'njangi', name: 'Njangi', amt: 150, kind: 'bill', rule: dom(1) },
        { id: 'fuel', name: 'Fuel', amt: 100, kind: 'fuel', rule: { t: 'weekly' } },
        { id: 'carmoola', name: 'Carmoola', amt: 121, kind: 'loan', rule: dom(1) },
        { id: 'zcc', name: 'Zable credit card', amt: 30, kind: 'loan', rule: dom(3) },
        { id: 'zloan', name: 'Zable loan', amt: 157, kind: 'loan', rule: dom(8) },
        { id: 'pot', name: 'Pot', amt: 50, kind: 'loan', rule: dom(1) },
        { id: 'ilr', name: 'ILR savings', amt: 125, kind: 'saving', rule: dom(1), from: '2027-01-01' }
      ],
      debts: [
        { id: 'gagan', name: 'Gagan', bal: 200, kind: 'debt' },
        { id: 'halifax', name: 'Halifax', bal: 415, kind: 'debt' },
        { id: 'monzo', name: 'Monzo overdraft', bal: 1000, kind: 'debt' }
      ],
      goals: [
        { id: 'flight', name: 'Flight ticket', target: 233, due: '2026-11-23', saved: 0 },
        { id: 'charity', name: 'Charity outreach', target: 600, due: '2027-02-28', saved: 0 }
      ],
      ticks: {},
      adds: []
    };
  }

  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }

  /*
   Plan = one entry per payday week from startFri.
   Past weeks: only what you ticked counts as real. No money is carried out of them.
   This week and later: bills first, then goals (earliest deadline first), then debts in your attack order.
   Money not sent to debts is carried forward so a heavy week later is already covered.
  */
  function computePlan(S, today, weeksAhead) {
    var start = S.settings.startFri;
    var cur = prevFri(today); if (cur < start) cur = start;
    var curIdx = diff(start, cur) / 7;
    var N = Math.max(8, curIdx + (weeksAhead || 60));
    var payKnown = S.settings.pay != null && S.settings.pay !== '';
    var pay = payKnown ? Number(S.settings.pay) : 0;
    var HZ = 26;
    var goalsSorted = S.goals.slice().sort(function (a, b) { return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; });
    var bal = {}, saved = {}, startTotal = 0;
    S.debts.forEach(function (d) { bal[d.id] = d.bal; startTotal += d.bal; });
    S.goals.forEach(function (g) { saved[g.id] = g.saved || 0; });

    // build every week's fixed rows and ticked goal/debt payments
    var weeks = [];
    for (var i = 0; i < N; i++) {
      var F = addDays(start, 7 * i), E = addDays(F, 7), rows = [];
      S.items.forEach(function (it) {
        if (it.on === false) return;
        occurrences(it, F, E).forEach(function (date) {
          var key = it.id + '|' + date, d = has(S.ticks, key);
          rows.push({ key: key, id: it.id, kind: it.kind, name: it.name, due: date, amt: it.amt, done: d, paid: d ? S.ticks[key] : null });
        });
      });
      rows.sort(function (a, b) { return a.due < b.due ? -1 : a.due > b.due ? 1 : b.amt - a.amt; });
      var inKey = 'in|' + F, inDone = has(S.ticks, inKey);
      var tg = {}, td = {}, extra = [];
      goalsSorted.forEach(function (g) {
        var k = 'gs|' + F + '|' + g.id;
        if (has(S.ticks, k)) { tg[g.id] = S.ticks[k]; extra.push({ key: k, kind: 'goal', gid: g.id, name: g.name, due: F, amt: S.ticks[k], done: true, paid: S.ticks[k] }); }
      });
      S.debts.forEach(function (d) {
        var k = 'dp|' + F + '|' + d.id;
        if (has(S.ticks, k)) { td[d.id] = S.ticks[k]; extra.push({ key: k, kind: d.kind === 'arrears' ? 'arrears' : 'debt', did: d.id, name: d.name, due: F, amt: S.ticks[k], done: true, paid: S.ticks[k] }); }
      });
      var fixedTotal = sum(rows.map(function (r) { return r.done ? r.paid : r.amt; }));
      var adds = (S.adds || []).filter(function (x) { return x.date >= F && x.date < E; });
      var addOut = sum(adds.filter(function (x) { return x.type !== 'in'; }).map(function (x) { return x.amt; }));
      var addIn = sum(adds.filter(function (x) { return x.type === 'in'; }).map(function (x) { return x.amt; }));
      weeks.push({ adds: adds, addOut: r2(addOut), addIn: r2(addIn), i: i, F: F, E: E, isPast: i < curIdx, isCurrent: i === curIdx, rows: rows, extra: extra, income: inDone ? S.ticks[inKey] : pay,
        incomeDone: inDone, inKey: inKey, fixedTotal: r2(fixedTotal), tg: tg, td: td, tgSum: sum(Object.keys(tg).map(function (k) { return tg[k]; })), tdSum: sum(Object.keys(td).map(function (k) { return td[k]; })) });
    }

    function reqFor(g, savedNow, F) {
      var remaining = g.target - savedNow;
      if (remaining <= 0.004) return 0;
      var last = prevFri(g.due), left = F <= last ? diff(F, last) / 7 + 1 : 0;
      return left > 0 ? Math.min(remaining, Math.ceil(remaining / left)) : remaining;
    }

    // past weeks: ticks only
    for (var p = 0; p < curIdx; p++) {
      var wp = weeks[p];

  /* ---------- monthly review ---------- */

            '<label>Type<select class="fld" data-f="obj" data-t="items" data-id="' + it.id + '" data-p="kind">' + [['bill', 'Bill'], ['loan', 'Loan'], ['fuel', 'Fuel'], ['saving', 'Savings']].map(function (o) { return '<option value="' + o[0] + '"' + (it.kind === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label>' +
            ruleEditor(it) + '<label>Starts from (optional)<input class="fld" type="date" data-f="obj" data-t="items" data-id="' + it.id + '" data-p="from" value="' + (it.from || '') + '"></label>' +
            '<label>Status<select class="fld" data-f="obj" data-t="items" data-id="' + it.id + '" data-p="on"><option value="1"' + (it.on !== false ? ' selected' : '') + '>Active</option><option value="0"' + (it.on === false ? ' selected' : '') + '>Paused</option></select></label>' +
            '<div class="full btns"><button class="btn sec sm" data-act="ed-item" data-id="' + it.id + '">Close</button><button class="btn danger sm" data-act="del" data-t="items" data-id="' + it.id + '">Delete</button></div></div>' : '') + '</div>';
      }).join('') + '</div></div>';
    });
    h += '<div class="card"><button class="btn" data-act="add-item">Add a bill or loan</button></div>';
    h += '<div class="sec-h"><h2>Backup</h2></div><div class="card"><p class="small muted" style="margin:0 0 10px">Your ticks and settings sync to your Claude account, so the phone and laptop match. A backup file is a second copy you keep yourself.</p><div class="btns"><button class="btn sec" data-act="export">Download backup</button><label class="btn sec" style="display:inline-flex;align-items:center">Restore from file<input type="file" accept="application/json,.json" data-f="import" hidden></label></div>' +
      (backupText != null ? '<textarea class="fld" style="margin-top:10px;min-height:140px" readonly>' + E(backupText) + '</textarea>' : '') + '</div>';
    return h;
  }

  var PLUS = '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
  function fabSheet() {
    var h = '<button class="fab" data-act="add-open" aria-label="Add something extra">' + PLUS + '</button>';
    if (!addOpen) return h;
    h += '<div class="scrim" data-act="add-close"></div><div class="sheet" role="dialog" aria-label="' + (sheetMode === 'goal' ? 'Add a savings goal' : 'Add something extra') + '">';
    if (sheetMode === 'goal') {
      return h + '<h2>Add a savings option</h2><div class="form">' +
        '<label class="full">What are you saving for?<input class="fld" id="ag-name" placeholder="e.g. Emergency fund, new phone, tithe"></label>' +
        '<label class="full">Type<select class="fld" id="ag-kind"><option value="target">One-off target with a due date</option><option value="monthly">Regular monthly saving</option></select></label>' +
        '<label>Amount (£)<input class="fld" id="ag-amt" type="number" inputmode="decimal" step="0.01" min="0"></label>' +
        '<label>Due date, or first month for a monthly saving<input class="fld" id="ag-date" type="date"></label>' +
        '<label>Day of month (monthly only)<input class="fld" id="ag-day" type="number" min="1" max="31" value="1"></label>' +
        '<div class="full btns"><button class="btn" data-act="add-goal2">Save</button><button class="btn sec" data-act="add-close">Cancel</button></div></div></div>';
    }
    return h + '<h2>Add something extra</h2><div class="form">' +
      '<label class="full">What was it?<input class="fld" id="ad-name" placeholder="e.g. Takeaway, birthday gift, overtime"></label>' +
      '<label>Amount (£)<input class="fld" id="ad-amt" type="number" inputmode="decimal" step="0.01" min="0"></label>' +
      '<label>Date<input class="fld" id="ad-date" type="date" value="' + today + '"></label>' +
      '<label class="full">Type<select class="fld" id="ad-type"><option value="out">Money out (spent or paid)</option><option value="in">Money in (extra income)</option><option value="save">Saved towards a goal</option></select></label>' +
      '<label class="full">Which goal? (only for saved)<select class="fld" id="ad-goal"><option value="">None</option>' + S.goals.map(function (g) { return '<option value="' + g.id + '">' + E(g.name) + '</option>'; }).join('') + '</select></label>' +
      '<div class="full btns"><button class="btn" data-act="add-save">Save</button><button class="btn sec" data-act="add-close">Cancel</button></div></div></div>';
  }

  /* ---------- render ---------- */
  var TABS = [['week', 'Week'], ['ahead', 'Ahead'], ['debts', 'Debts'], ['month', 'Month'], ['setup', 'Setup']];
  function render() {
    var scroll = window.scrollY, active = document.activeElement && document.activeElement.id;
    var body = tab === 'week' ? viewWeek() : tab === 'ahead' ? viewAhead() : tab === 'debts' ? viewDebts() : tab === 'month' ? viewMonth() : viewSetup();
    $app.innerHTML = '<div class="top"><div class="brand">Friday Ledger</div><div class="sync ' + (sync.state === 'ok' ? 'ok' : sync.state === 'off' ? 'off' : '') + '"><i></i>' + E(sync.note) + '</div></div><main class="stack">' + body + '</main>' +
      '<nav class="nav" aria-label="Sections"><div>' + TABS.map(function (t) { return '<button data-act="tab" data-tab="' + t[0] + '"' + (tab === t[0] ? ' aria-current="page"' : '') + '>' + IC[t[0] === 'week' ? 'week' : t[0]] + t[1] + '</button>'; }).join('') + '</div></nav>' + fabSheet();
    window.scrollTo(0, scroll);
    var inp = document.querySelector('input[data-commit]');
    if (inp) { inp.focus(); inp.select(); } else if (active === 'payInit') { var pi = document.getElementById('payInit'); if (pi) pi.focus(); }
  }

  /* ---------- actions ---------- */
  function setTick(key, v) { if (isNaN(v) || v < 0) v = 0; S.ticks[key] = Math.round(v * 100) / 100; }
  var act = {
    'add-open': function () { sheetMode = 'extra'; addOpen = true; render(); var n = document.getElementById('ad-name'); if (n) n.focus(); },
    'goal-open': function () { sheetMode = 'goal'; addOpen = true; render(); var n = document.getElementById('ag-name'); if (n) n.focus(); },
    'add-close': function () { addOpen = false; render(); },
    'add-save': function () {
      var n = document.getElementById('ad-name').value.trim(), a = parseFloat(document.getElementById('ad-amt').value), d = document.getElementById('ad-date').value, ty = document.getElementById('ad-type').value, gid = document.getElementById('ad-goal').value;
      if (!n || isNaN(a) || a <= 0 || !d) { toast('Add a name, an amount and a date'); return; }
      a = Math.round(a * 100) / 100;
      if (ty === 'save') {
        if (!gid) { toast('Pick which goal you saved towards'); return; }
        var F = FL.prevFri(d); if (F < S.settings.startFri) F = S.settings.startFri;
        var k = 'gs|' + F + '|' + gid; S.ticks[k] = Math.round(((S.ticks[k] || 0) + a) * 100) / 100;
        addOpen = false; commit(); toast('Saved ' + gbp(a) + ' towards ' + S.goals.filter(function (g) { return g.id === gid; })[0].name); return;
      }
      S.adds.push({ id: 'a' + Date.now().toString(36), name: n, amt: a, date: d, type: ty });
      addOpen = false; commit(); toast('Added to the week of ' + dDay(FL.prevFri(d)));
    },
    'add-goal2': function () {
      var n = document.getElementById('ag-name').value.trim(), k = document.getElementById('ag-kind').value, a = parseFloat(document.getElementById('ag-amt').value), d = document.getElementById('ag-date').value, day = parseInt(document.getElementById('ag-day').value, 10) || 1;
      if (!n || isNaN(a) || a <= 0 || !d) { toast('Add a name, an amount and a date'); return; }
      var id = 'g' + Date.now().toString(36);
      if (k === 'target') S.goals.push({ id: id, name: n, target: a, due: d, saved: 0 });
      else S.items.push({ id: id, name: n, amt: a, kind: 'saving', rule: { t: 'dom', day: Math.min(31, Math.max(1, day)) }, from: d });
      addOpen = false; commit(); toast(k === 'target' ? 'Savings goal added' : 'Monthly saving added');
    },
    'add-del': function (t) { S.adds = S.adds.filter(function (x) { return x.id !== t.dataset.id; }); commit(); toast('Removed'); },
    tab: function (t) { tab = t.dataset.tab; editKey = null; window.scrollTo(0, 0); render(); },
    tick: function (t) {
      var k = t.dataset.key, amt = parseFloat(t.dataset.amt) || 0;
      if (has(S.ticks, k)) delete S.ticks[k]; else setTick(k, amt);
      editKey = null; commit();
    },
    edit: function (t) { editKey = t.dataset.key; render(); },
    wk: function (t) { var ci = curIdx(), i = (sel == null ? ci : sel) + Number(t.dataset.d); sel = Math.max(0, Math.min(ci + 25, i)); if (sel === ci) sel = null; editKey = null; render(); window.scrollTo(0, 0); },
    open: function (t) { sel = Number(t.dataset.i); if (sel === curIdx()) sel = null; tab = 'week'; window.scrollTo(0, 0); render(); },
    mo: function (t) { monthSel = FL.addMonths(monthSel || today.slice(0, 7), Number(t.dataset.d)); render(); },
    savepay: function () { var v = parseFloat(document.getElementById('payInit').value); if (isNaN(v) || v <= 0) { toast('Enter your weekly pay as a number'); return; } S.settings.pay = v; commit(); },
    mv: function (t) {
      var i = S.debts.findIndex(function (d) { return d.id === t.dataset.id; }), j = i + Number(t.dataset.d);
      if (j < 0 || j >= S.debts.length) return; var x = S.debts.splice(i, 1)[0]; S.debts.splice(j, 0, x); commit();
    },
    'ed-debt': function (t) { editDebt = editDebt === t.dataset.id ? null : t.dataset.id; render(); },
    'ed-goal': function (t) { editGoal = editGoal === t.dataset.id ? null : t.dataset.id; render(); },
    'ed-item': function (t) { editItem = editItem === t.dataset.id ? null : t.dataset.id; render(); },
    del: function (t) {
      var list = S[t.dataset.t], id = t.dataset.id, ix = list.findIndex(function (x) { return x.id === id; });
      if (t.dataset.sure !== '1') { t.dataset.sure = '1'; t.textContent = 'Tap again to delete'; return; }
      if (ix > -1) list.splice(ix, 1); editDebt = editGoal = editItem = null; commit();
    },
    'add-debt': function () {
      var n = document.getElementById('nd-name').value.trim(), a = parseFloat(document.getElementById('nd-amt').value), k = document.getElementById('nd-kind').value;
      if (!n || isNaN(a) || a <= 0) { toast('Add a name and an amount'); return; }
      var d = { id: 'd' + Date.now().toString(36), name: n, bal: a, kind: k };
      if (k === 'arrears') S.debts.unshift(d); else S.debts.push(d); commit(); toast('Added to the list');
    },
    'add-goal': function () {
      var n = document.getElementById('ng-name').value.trim(), a = parseFloat(document.getElementById('ng-amt').value), d = document.getElementById('ng-due').value;
      if (!n || isNaN(a) || a <= 0 || !d) { toast('Add a name, amount and due date'); return; }
      S.goals.push({ id: 'g' + Date.now().toString(36), name: n, target: a, due: d, saved: 0 }); commit(); toast('Goal added');
    },
    'add-item': function () {
      var id = 'x' + Date.now().toString(36);
      S.items.push({ id: id, name: 'New bill', amt: 0, kind: 'bill', rule: { t: 'dom', day: 1 } }); editItem = id; commit();
    },
    export: function () {
      var json = JSON.stringify(S, null, 2);
      if (!dl) { backupText = json; render(); return; }
      dl.save({ filename: 'friday-ledger-backup-' + today + '.json', data: json }).then(function () { toast('Backup saved'); }, function (e) { if (e && e.code === 'declined') return; backupText = json; render(); });
    }
  };
  document.addEventListener('click', function (e) { var t = e.target.closest('[data-act]'); if (t && act[t.dataset.act]) act[t.dataset.act](t, e); });
  document.addEventListener('keydown', function (e) {
    if (e.target.dataset && e.target.dataset.commit) { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') { editKey = null; render(); } }
  });
  document.addEventListener('focusout', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.commit && editKey != null) setTimeout(function () { if (editKey != null && !document.querySelector('input[data-commit]:focus')) { editKey = null; render(); } }, 120);
  });
  document.addEventListener('change', function (e) {
    var t = e.target, f = t.dataset && t.dataset.f; if (!f) return;
    if (f === 'amt') {
      var v = parseFloat(t.value); editKey = null;
      if (t.value === '' || isNaN(v)) { render(); return; }
      setTick(t.dataset.key, v); commit();
    } else if (f === 'pay') { S.settings.pay = t.value === '' ? null : Math.max(0, parseFloat(t.value) || 0); commit(); }
    else if (f === 'start') {
      if (!t.value || FL.dow(t.value) !== 5) { toast('Pick a Friday'); render(); return; }
      S.settings.startFri = t.value; commit();
    } else if (f === 'obj') {
      var list = S[t.dataset.t], o = list.filter(function (x) { return x.id === t.dataset.id; })[0], p = t.dataset.p, val = t.value;
      if (!o) return;
      if (p === 'amt' || p === 'bal' || p === 'target' || p === 'saved') o[p] = Math.max(0, parseFloat(val) || 0);
      else if (p === 'on') o.on = val === '1';
      else if (p === 'from') { if (val) o.from = val; else delete o.from; }
      else if (p === 'rt') { o.rule = val === 'dom' ? { t: 'dom', day: 1 } : val === 'nth' ? { t: 'nth', n: 1 } : val === 'every' ? { t: 'every', n: 2, anchor: plan.curFri } : { t: 'weekly' }; }
      else if (p === 'rd') o.rule.day = Math.min(31, Math.max(1, parseInt(val, 10) || 1));
      else if (p === 'rn') o.rule.n = Math.max(1, parseInt(val, 10) || 1);
      else if (p === 'ra') { if (val) o.rule.anchor = val; }
      else o[p] = val;
      commit();
    } else if (f === 'import') {
      var file = t.files && t.files[0]; if (!file) return;
      var rd = new FileReader();
      rd.onload = function () { try { var o = norm(JSON.parse(rd.result)); o.rev = Date.now(); S = o; commit(true); S.rev = Date.now(); commit(); toast('Backup restored'); } catch (err) { toast('That file is not a Friday Ledger backup'); } };
      rd.readAsText(file);
    }
  });

  /* ---------- sync (private to your account) ---------- */
  var dl = null, ref = null, writing = false, dirty = false, wt = null;
  function setSync(state, note) { sync = { state: state, note: note }; var el = document.querySelector('.sync'); if (el) { el.className = 'sync ' + (state === 'ok' ? 'ok' : state === 'off' ? 'off' : ''); el.innerHTML = '<i></i>' + E(note); } }
  function queueSync() {
    if (!ref) return; dirty = true; clearTimeout(wt); wt = setTimeout(flush, 700);
  }
  function flush() {
    if (writing || !dirty || !ref) return;
    writing = true; dirty = false;
    ref.set({ rev: S.rev, json: JSON.stringify(S) }).then(function () { writing = false; setSync('ok', 'Synced'); if (dirty) flush(); }, function () { writing = false; setSync('off', 'Saved on this device only'); });
  }
  function initSync() {
    if (!window.claude || !window.claude.use) return;
    Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads')]).then(function (r) {
      var db = r[0], user = r[1]; dl = r[2];
      if (!db || !user) { setSync('off', 'Saved on this device only'); return null; }
      return user.id().then(function (uid) {
        if (!uid) { setSync('off', 'Sign in to sync devices'); return; }
        ref = db.doc('data/users/' + uid + '/budget');
        var lt = setTimeout(function () { setSync('off', 'Cannot reach sync. Saved on this device'); }, 10000);
        ref.onSnapshot(function (snap) {
          if (snap.metadata.hasPendingWrites) return;
          clearTimeout(lt);
          var d = snap.exists ? snap.data() : null;
          if (d && typeof d.json === 'string') {
            var remote; try { remote = norm(JSON.parse(d.json)); } catch (e) { remote = null; }
            if (remote && (remote.rev || 0) > (S.rev || 0)) { S = remote; saveLocal(); recompute(); render(); setSync('ok', 'Synced'); return; }
            if (remote && (remote.rev || 0) < (S.rev || 0)) { queueSync(); return; }
            setSync('ok', 'Synced');
          } else { queueSync(); setSync('ok', 'Synced'); }
        }, function () { clearTimeout(lt); setSync('off', 'Saved on this device only'); });
      });
    }).then(function () { render(); }, function () { setSync('off', 'Saved on this device only'); });
  }

  /* ---------- rolling weeks: re-plan when the date changes ---------- */
  function rollover() { var t = todayISO(); if (t !== today) { today = t; sel = null; recompute(); render(); } }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) rollover(); });
  setInterval(rollover, 60000);

  recompute(); render(); initSync();
})();
</script>

</body>
